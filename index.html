<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAI CHOY PONDEROSA 2F</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box}body{background:#0f172a;color:white;font:16px Arial;margin:0;padding:16px}main{max-width:650px;margin:auto;background:#1e293b;padding:20px;border-radius:16px}h2,h3,p{text-align:center}input,button,select{width:100%;padding:14px;margin:6px 0;border:0;border-radius:8px;font-size:16px}button{background:#2563eb;color:white;font-weight:bold}button:disabled{opacity:.5}.green{background:#15803d}.red{background:#b91c1c}.hidden{display:none}#message{white-space:pre-wrap;text-align:center;padding:12px}#reader{overflow:hidden}li{padding:5px}article{background:#334155;padding:12px;margin:8px 0;border-radius:8px}progress{width:100%}</style></head><body><main><h2>WAI CHOY PONDEROSA 2F</h2><p>SECURITY PATROL SYSTEM</p><section id="loginBox"><input id="uid" placeholder="GUARD ID / ADMIN" autocomplete="username"><input id="pin" type="password" placeholder="PIN" autocomplete="current-password"><button id="loginBtn">LOGIN</button></section><section id="guardBox" class="hidden"><h3 id="name"></h3><p id="round"></p><h3 id="count"></h3><progress id="bar" value="0" max="15"></progress><button id="scanBtn" class="green">MULA SCAN QR</button><div id="reader"></div><button id="stopBtn">HENTI SCAN</button><button id="refreshBtn">KEMAS KINI STATUS</button><details><summary>Checkpoint belum diimbas</summary><ul id="missing"></ul></details></section><section id="adminBox" class="hidden"><h3>ADMIN DASHBOARD</h3><input id="date" type="date"><select id="mode"><option value="day">Laporan harian</option><option value="month">Laporan bulanan</option></select><button id="reportBtn">PAPAR LAPORAN</button><div id="summary"></div><div id="report"></div></section><button id="logoutBtn" class="red hidden">LOG KELUAR</button><div id="message" role="status"></div></main><script>
const API='https://script.google.com/macros/s/AKfycbwL5QHAGln3OOWxNWgWr9uvkAiynikp_SPACKRJnTOuWL3PH5KnOPU6_sznVd6fnZIQ/exec';const $=id=>document.getElementById(id);let token='',scanner=null,busy=false;function msg(s,ok=false){$('message').textContent=s;$('message').style.color=ok?'#86efac':'#fca5a5'}function show(id,on){$(id).classList.toggle('hidden',!on)}async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,token,...extra})});const j=await r.json();if(!j.success)throw Error(j.error);return j.data}function render(p){$('round').textContent=p.date+' | '+p.shift+' | '+p.time+' – '+p.endTime+' | '+p.status;$('count').textContent=p.count+' / '+p.total+' checkpoint';$('bar').max=p.total||1;$('bar').value=p.count;$('missing').replaceChildren(...p.missing.map(c=>{const l=document.createElement('li');l.textContent=c.id+' – '+c.name;return l}))}async function refresh(){try{render(await api('progress'));msg('Status dikemas kini.',true)}catch(e){msg(e.message)}}async function report(){try{const p=await api('report',{date:$('date').value,monthly:$('mode').value==='month'});$('summary').textContent='Prestasi: '+p.performance.toFixed(2)+'% | Pusingan dinilai: '+p.closed+' | '+Object.entries(p.counts).map(([k,v])=>k+': '+v).join(' | ');$('report').replaceChildren(...p.rows.map(r=>{const a=document.createElement('article');a.textContent=r.date+' | '+r.time+' – '+r.endTime+' | '+r.shift+' | '+r.count+'/'+r.total+' | '+r.status+' | '+(r.guards||'Tiada imbasan');return a}));msg('Laporan dikemas kini.',true)}catch(e){msg(e.message)}}$('loginBtn').onclick=async()=>{$('loginBtn').disabled=true;try{const p=await api('login',{guardId:$('uid').value,pin:$('pin').value});token=p.token;$('pin').value='';show('loginBox',false);show('logoutBtn',true);show('guardBox',p.role==='GUARD');show('adminBox',p.role==='ADMIN');$('name').textContent=p.name;$('date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kuala_Lumpur',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());if(p.role==='ADMIN')await report();else await refresh()}catch(e){msg(e.message)}finally{$('loginBtn').disabled=false}};async function stop(){if(scanner){await scanner.stop();scanner.clear();scanner=null}$('scanBtn').disabled=false}async function scanned(text){if(busy)return;busy=true;try{await stop();$('scanBtn').disabled=true;const p=await api('patrol',{qrId:text.trim().toUpperCase()});render(p);msg('REKOD BERJAYA: '+p.location,true)}catch(e){msg(e.message)}finally{busy=false;$('scanBtn').disabled=false}}$('scanBtn').onclick=async()=>{if(busy||scanner)return;$('scanBtn').disabled=true;busy=true;try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},scanned,()=>{});msg('Halakan kamera ke QR.',true)}catch(e){scanner=null;$('scanBtn').disabled=false;msg(String(e))}finally{busy=false}};$('stopBtn').onclick=async()=>{if(!busy)try{await stop()}catch(e){msg(String(e))}};$('refreshBtn').onclick=refresh;$('reportBtn').onclick=report;$('logoutBtn').onclick=async()=>{if(busy)return;try{await stop();await api('logout')}catch(e){msg(e.message)}finally{token='';show('guardBox',false);show('adminBox',false);show('logoutBtn',false);show('loginBox',true);$('report').replaceChildren();$('summary').textContent='';msg('Log keluar.',true)}};
</script></body></html>
